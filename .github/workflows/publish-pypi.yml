name: Build and publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching Cargo.toml (e.g. 0.14.0)'
        required: true
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/wheels.yml
    with:
      expected-version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: dist/*
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
