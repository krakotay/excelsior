name: Build and test wheels

on:
  workflow_call:
    inputs:
      expected-version:
        type: string
        default: ''
  push:
    branches: [master]
    paths:
      - 'Cargo.*'
      - 'rust-core/**'
      - 'python-bindings/**'
      - '.github/**'
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-core/**'
      - 'python-bindings/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate release version
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: python .github/scripts/check_version.py

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.15.0'
          rust-toolchain: stable
          command: build
          manylinux: ${{ runner.os == 'Linux' && '2_28' || 'off' }}
          target: ${{ runner.os == 'macOS' && 'universal2-apple-darwin' || '' }}
          args: >-
            --release --locked --out dist
            -m python-bindings/Cargo.toml
            --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python-version) || 'python' }}
      - name: Install wheel without optional dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
      - name: Smoke test standalone package
        run: python python-bindings/tests/smoke_standalone.py
      - name: Install test dependencies
        run: python -m pip install pytest openpyxl "polars>=1.35"
      - name: Test installed wheel
        run: python -m pytest python-bindings/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  polars-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        polars-version: ['1.35.2', '2.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and test dependencies
        run: python -m pip install "maturin>=1.13,<2" pytest openpyxl "polars==${{ matrix.polars-version }}"
      - name: Build and install wheel
        run: >-
          python -m pip install --no-deps --no-build-isolation ./python-bindings
      - name: Test Python Polars adapter
        run: python -m pytest python-bindings/tests/test_polars_types.py python-bindings/tests/test_015_regressions.py python-bindings/tests/test_streaming_cow_xml.py python-bindings/tests/test_0151_parallel.py python-bindings/tests/test_0152_pool.py -q

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.15.0'
          command: sdist
          args: -m python-bindings/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
