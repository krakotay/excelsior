name: Rust

on:
  push:
    branches: [ "master" ]
    paths:
      - 'rust-core/**'
      - 'Cargo.*'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'rust-core/**'
      - 'Cargo.*'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --locked -p rust-core --verbose
    - name: Run tests
      run: cargo test --locked -p rust-core --verbose
